aid: j2-innovations

name: J2 Innovations

description: J2 Innovations ("A Siemens Company") is the creator of FIN Framework (FIN), an open software platform for smart buildings, smart
  equipment and IoT, used by OEMs, system integrators and building owners for building automation, supervisory control and edge-to-cloud applications.
  Based in California, it is a wholly-owned subsidiary of Siemens AG and an independent legal entity, and a founder and supporter of Project Haystack.
  Product documentation for FIN is published at docs.finproducts.com.

